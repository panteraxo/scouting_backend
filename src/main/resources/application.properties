spring.application.name=scouting
# PORT de la plataforma tiene prioridad; SERVER_PORT permite fijarlo en local/Docker.
server.port=${PORT:${SERVER_PORT:9193}}


# MySQL local o gestionado (por ejemplo, Aiven). La URL se define por entorno.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=debug

# Sesion: cookie HttpOnly, solo cookie (sin URL rewriting), Secure configurable por entorno.
# En produccion usar el perfil `prod` o SESSION_COOKIE_SECURE=true.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:Lax}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# Errores sin detalles internos
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# CORS: en produccion declarar los origenes autorizados en APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://scouting-frontend-ten.vercel.app}
